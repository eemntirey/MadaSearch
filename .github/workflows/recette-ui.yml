name: Recette UI Windows — Phase 8
on:
  push:
    branches: [integration/audit-design-moderne]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recette-ui-\${{ github.ref }}
  cancel-in-progress: true
jobs:
  recette-ui:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore MadagascarBrowser.sln
      - run: dotnet build MadagascarBrowser.sln --configuration Release --no-restore
      - name: Inventaire xUnit par SHA
        shell: pwsh
        env:
          GITHUB_TOKEN: \${{ github.token }}
          GITHUB_SHA: \${{ github.sha }}
        run: ./scripts/recette/Compare-TestAttributes.ps1
      - name: Tests .NET avec TRX
        shell: pwsh
        run: dotnet test MadagascarBrowser.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory artifacts/test-results
      - name: Test UI FlaUI/UIA3
        shell: pwsh
        env:
          MADAGASCARBROWSER_EXE: \${{ github.workspace }}\src\MadagascarBrowser\bin\Release\net8.0-windows\MadagascarBrowser.exe
        run: |
          if (-not (Test-Path -LiteralPath $env:MADAGASCARBROWSER_EXE)) { throw "WPF executable missing: $env:MADAGASCARBROWSER_EXE" }
          dotnet test tests/MadagascarBrowser.UiTests/MadagascarBrowser.UiTests.csproj --configuration Release --logger "trx;LogFileName=ui-tests.trx" --results-directory artifacts/ui-trx
      - name: Statuts de recette sans faux PASS
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/recette | Out-Null
          $ids=@("GUI-01","GUI-02","GUI-03","GUI-04","GUI-05","GUI-06","GUI-07","GUI-08","GUI-09","GUI-10","GUI-11","GUI-12","GUI-13")
          $rows=foreach($id in $ids){[pscustomobject]@{scenario=$id;status="non exécuté — manuel";sha="\${{ github.sha }}";evidence=@();reason="Le smoke test UI ne valide pas ce scénario; aucune assertion métier liée à ses preuves n'est implémentée.";exit_criteria="Automatiser l'action et l'assertion ou déposer les preuves humaines."}}
          [pscustomobject]@{generated_at=[DateTimeOffset]::UtcNow.ToString("o");sha="\${{ github.sha }}";workflow="\${{ github.server_url }}/\${{ github.repository }}/actions/runs/\${{ github.run_id }}";scenarios=@($rows)} | ConvertTo-Json -Depth 8 | Set-Content artifacts/recette/recette-resultats.json -Encoding utf8
          @("# Résultats GUI","","SHA: \${{ github.sha }}","GUI-01 à GUI-13: non exécuté — manuel; aucun PASS n'est inféré du smoke test.") | Set-Content artifacts/recette/recette-resultats.md -Encoding utf8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recette-ui-\${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            artifacts/recette/**
            artifacts/test-results/**
            artifacts/ui-trx/**
            docs/recette/attributs-tests/**
